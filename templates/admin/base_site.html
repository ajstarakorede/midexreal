{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<link rel="icon" href="{% static 'card/assets/favicon.ico' %}" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'card/assets/favicon-32.png' %}" />
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'card/assets/favicon-16.png' %}" />
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'card/assets/apple-touch-icon.png' %}" />
{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}" class="midex-admin-brand">
    <img src="{% static 'card/assets/logo.png' %}" alt="" class="midex-admin-logo" />
    <span>MIDEX Admin</span>
  </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  .midex-admin-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .midex-admin-logo {
    height: 30px;
    width: auto;
    display: block;
  }
  #branding h1,
  #branding h1 a:link,
  #branding h1 a:visited {
    color: #ffffff;
  }
  #header {
    background: #1b2340; /* matches the card's ink-navy */
  }
  div.breadcrumbs {
    background: #131a30; /* ink-navy-deep */
  }
  .button.default,
  input[type="submit"].default,
  .submit-row input.default {
    background: #1b2340;
  }
  .button.default:hover,
  input[type="submit"].default:hover {
    background: #131a30;
  }
  a:link, a:visited {
    color: #1b2340;
  }
</style>
{% endblock %}
